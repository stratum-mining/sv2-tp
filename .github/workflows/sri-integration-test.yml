name: SRI integration test

on:
  workflow_call:

jobs:
  sri-integration-test:
    name: 'SRI integration test (Bitcoin Core ${{ matrix.core.name }}, ${{ matrix.scenario.name }})'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        core:
          # Set version for a downloaded release, or ref for a source build.
          - name: v31.1
            version: '31.1'
            ref: ''
          - name: v32.0rc2
            version: '32.0rc2'
            ref: ''
          - name: memusage
            version: ''
            ref: refs/pull/33922/head
            expect_memory_load: true
        scenario:
          - name: end-to-end mining
            id: mining
            mode: run-mining
            needs_sv2_apps: true
          - name: backend disconnect
            id: backend-disconnect
            mode: run-backend-disconnect
            needs_sv2_apps: false
    env:
      BITCOIN_CORE_VERSION: ${{ matrix.core.version }}
      BITCOIN_CORE_REF: ${{ matrix.core.ref }}
      EXPECT_MEMORY_LOAD: ${{ matrix.core.expect_memory_load || false }}
      BITCOIN_CORE_PLATFORM: x86_64-linux-gnu
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      SCENARIO_ROOT: ${{ github.workspace }}/sri-integration-test
      RUNTIME_ROOT: ${{ github.workspace }}/sri-integration-test/${{ matrix.scenario.id }}
      SV2_APPS_REF: main
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || '' }}

      - name: Install apt packages
        run: |
          sudo apt-get update
          sudo apt-get install clang mold ccache build-essential cmake ninja-build pkgconf libboost-dev libevent-dev libsqlite3-dev systemtap-sdt-dev capnproto libcapnp-dev -y

      - name: ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-sri-${{ matrix.core.name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-sri-${{ matrix.core.name }}-
            ccache-${{ runner.os }}-

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          toolchain: 1.88.0

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Prepare Bitcoin Core
        run: ./ci/test/04_run_stratum_v2_scenario.sh build-bitcoin-core

      - name: Build sv2-tp
        run: ./ci/test/04_run_stratum_v2_scenario.sh build-sv2-tp

      - name: Build sv2-apps
        if: ${{ matrix.scenario.needs_sv2_apps }}
        run: ./ci/test/04_run_stratum_v2_scenario.sh build-sv2-apps

      - name: Run ${{ matrix.scenario.name }} test
        run: ./ci/test/04_run_stratum_v2_scenario.sh "${{ matrix.scenario.mode }}"

      - name: 'Result: Bitcoin Core'
        if: always()
        run: |
          echo '::group::bitcoin debug.log'
          cat "${RUNTIME_ROOT}/datadir/regtest/debug.log" || true
          echo '::endgroup::'

      - name: 'Result: sv2-tp'
        if: always()
        run: |
          echo '::group::sv2-tp stdout/stderr'
          cat "${RUNTIME_ROOT}/logs/sv2-tp.log" || true
          echo '::endgroup::'
          echo '::group::sv2-tp debug log'
          cat "${RUNTIME_ROOT}/datadir/regtest/sv2-debug.log" || true
          echo '::endgroup::'

      - name: 'Result: pool_sv2'
        if: ${{ always() && matrix.scenario.id == 'mining' }}
        run: |
          echo '::group::pool_sv2 log'
          cat "${RUNTIME_ROOT}/logs/pool.log" || true
          echo '::endgroup::'

      - name: 'Result: mining_device'
        if: ${{ always() && matrix.scenario.id == 'mining' }}
        run: |
          echo '::group::mining_device log'
          cat "${RUNTIME_ROOT}/logs/mining-device.log" || true
          echo '::endgroup::'
